# Continuous Integration (CI) Workflow for Genki Monorepo
# This workflow runs validation checks on pull requests targeting main or develop branches.

name: CI Pipeline

on:
  pull_request:
    branches:
      - main
      - develop

# Set Turborepo cache directory to .turbo for GitHub Actions caching
env:
  TURBO_CACHE_DIR: .turbo

# Cancel in-progress jobs from the same branch/PR if a new commit is pushed (fail-fast behavior)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the source code from the repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Fetch history for Turborepo's git comparison

      # Step 2: Set up pnpm package manager in the runner
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.10.0

      # Step 3: Setup Node.js (v20) and cache pnpm global stores
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # Step 4: Configure Turborepo build caching using GitHub Actions cache
      # This stores build/test/lint outputs to speed up subsequent runs
      - name: Cache Turborepo Build Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # Step 5: Install project dependencies using the frozen lockfile to ensure reproducible builds
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Step 6: Run ESLint across all workspaces via Turborepo
      - name: Run ESLint (Lint)
        run: pnpm turbo lint

      # Step 7: Run TypeScript strict type-checking across all workspaces via Turborepo
      - name: Run TypeScript (Typecheck)
        run: pnpm turbo typecheck

      # Step 8: Run unit tests (Vitest) across all workspaces via Turborepo
      - name: Run Unit Tests (Test)
        run: pnpm turbo test
