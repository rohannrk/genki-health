version: '3.8'

services:
  backend:
    build:
      context: ../../
      dockerfile: apps/backend/Dockerfile
    container_name: medcopilot-backend
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - ./src:/app/apps/backend/src
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-medcopilot}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-medcopilot-documents}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medcopilot-network

  postgres:
    # pgvector-enabled Postgres 16 (drop-in for postgres:16) — required by the
    # 0001_add_pgvector migration (CREATE EXTENSION vector).
    image: pgvector/pgvector:pg16
    container_name: medcopilot-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-medcopilot}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medcopilot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - medcopilot-network

volumes:
  postgres-data:

networks:
  medcopilot-network:
    name: medcopilot-network
